<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Pledges - Eco-Friendly Backpack</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%2310b981%22>🎁🎁</text></svg>"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/general-style.css" />
    <link rel="stylesheet" href="../css/campaign-pledges.css" />
  </head>
  <body>
    <div class="container">
      <!-- Campaign Header -->
      <div class="campaign-header">
        <div class="campaign-info">
          <div class="campaign-title-section">
            <a href="#" id="back-to-campaign" class="back-link">
              <span class="material-symbols-outlined">arrow_back</span>
              Back to Campaign
            </a>
            <h1>Eco-Friendly Modular Backpack</h1>
            <p class="campaign-creator">
              Created by <span class="creator-name">Sayed mohamed</span>
            </p>
          </div>

          <div class="campaign-stats">
            <div class="stat-item">
              <span class="stat-label">Total Raised</span>
              <span class="stat-value">$18,500</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Goal</span>
              <span class="stat-value">$20,000</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Total Pledges</span>
              <span class="stat-value">127</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Days Left</span>
              <span class="stat-value">25</span>
            </div>
          </div>
        </div>

        <div class="campaign-progress-section">
          <div class="progress-info">
            <span class="progress-percent">92% funded</span>
            <span class="progress-amount">$1,500 to go</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: 92%"></div>
          </div>
        </div>
      </div>

      <!-- Pledges Section -->
      <div class="pledges-section">
        <div class="section-header">
          <h2>Campaign Pledges</h2>
        </div>

        <!-- Pledges List -->
        <div class="pledges-container">
          <!-- Pledge Card 1 -->
          <div class="pledge-card">
            <div class="pledger-info">
              <div class="pledger-avatar">
                <span class="material-symbols-outlined">person</span>
              </div>
              <div class="pledger-details">
                <h3 class="pledger-name" style="margin-top: 10px">
                  Alex Johnson
                </h3>
              </div>
            </div>

            <div class="pledge-amount">
              <span class="amount-label">Pledged Amount</span>
              <span class="amount-value">$185.00</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/campaign-pledges.js"></script>
  </body>
</html>
