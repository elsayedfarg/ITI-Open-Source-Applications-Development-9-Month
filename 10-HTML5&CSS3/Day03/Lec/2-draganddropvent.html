<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <style>
      main {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      section {
        width: 400px;
        height: 400px;
        border: 1px solid black;
        border-radius: 5px;
        padding: 5px;
        margin: 20px;
        text-align: center;
        box-shadow: 5px 5px 20px #888888;
      }

      img {
        width: 100px;
        height: 100px;
        margin: 10px;
      }
    </style>
  </head>

  <body>
    <main>
      <section id="left"></section>
      <section id="right">
        <img src="images/1.png" />
        <img src="images/2.png" />
        <img src="images/3.png" />
        <img src="images/4.png" />
        <img src="images/5.png" />
        <img src="images/6.png" />
        <img src="images/7.png" />
        <img src="images/8.png" />
      </section>
    </main>

    <script>
      // images -> dragstart , dragend
      window.addEventListener("load", function(){
        const leftSection = document.getElementById("left");
        const rightSection = document.getElementById("right");
        const images = document.images;

        for(i = 0; i < images.length; i++){
          images[i].addEventListener("dragstart", function (e) {
            console.log("Dragging image:", e.target.outerHTML);
            e.dataTransfer.setData("myImg", e.target.outerHTML);
          });

          images[i].addEventListener("dragend", function (e) {
            console.log("Drag ended for image:", e.target.src);
            e.target.style.display = "none";
          });
        }

        // rightSection -> dragleave
        rightSection.addEventListener("dragleave", function(e){
          e.preventDefault();
        })


        // LeftSection -> dragenter, dragover, drop
        leftSection.addEventListener("dragenter", function(e){
          e.preventDefault();
          leftSection.style.backgroundColor = "#f0f0f0";
        });

        leftSection.addEventListener("dragover", function(e){
          e.preventDefault();
        });


        leftSection.addEventListener("drop", function(e){
          e.preventDefault();
          leftSection.innerHTML += e.dataTransfer.getData("myImg")
        });
      })
    </script>
  </body>
</html>
