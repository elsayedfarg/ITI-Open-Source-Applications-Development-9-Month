<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Video Playlist Player</title>
  </head>
  <body>
    <div class="container">
      <div class="playlist-sidebar">
        <h2 class="playlist-title">Playlist</h2>
        <div id="playlistItems"></div>
      </div>

      <div class="video-container">
        <div class="video-wrapper">
          <video id="mainVideo" preload="metadata">
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="video-info">
          <h3 class="current-video-title" id="currentTitle">
            Select a video to play
          </h3>
          <p class="video-controls-info">
            Single click: Play/Pause | Double click: Fullscreen
          </p>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
