<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Subtitles and translation</title>
  </head>
  <body>
    <video id="videoPlayer" src="video-360p.mp4" poster="">
      <!-- ============================= TASK 1 ============================== -->
      <track
        kind="subtitles"
        src="subtitles-en.vtt"
        srclang="en"
        label="English"
        default
      />

      <track
        kind="subtitles"
        src="subtitles-ar.vtt"
        srclang="ar"
        label="Arabic"
      />
    </video>
    <input
      type="range"
      name=""
      id="seekBar"
      min="0"
      max="100"
      value="0"
      onchange="seekVideo(event)"
      style="width: 80vw"
    />
    <section id="controls">
      <!-- ============================= TASK 1 ============================== -->
      <select id="subtitleSelect" onchange="changeSubtitle(this.value)">
        <option value="off">Subtitles Off</option>
        <option value="en">English</option>
        <option value="ar">Arabic</option>
      </select>

      <!-- ============================= TASK 2 ============================== -->
      <select id="qualitySelect" onchange="changeQuality(this.value)">
        <option value="360">360p</option>
        <option value="720" selected>720p</option>
        <option value="1080">1080p</option>
      </select>

      <button id="playPauseButton" onclick="togglePlayPause()">Play</button>
      <button id="forwaredButton" onclick="forwardFunction()">
        <i class="fa-solid fa-rotate-right"></i>10
      </button>
      <button id="backwardButton" onclick="backwardFunction()">
        <i class="fa-solid fa-rotate-left"></i>10
      </button>

      <select id="videoSizeSelect" onchange="changeVideoSize(event)">
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
      </select>

      <!-- مستوى الـ صوت -->
      <input
        type="range"
        id="volumeRange"
        min="0"
        max="1"
        step="0.1"
        value="0.5"
        onchange="changeVolume(event)"
      />

      <!-- سرعة التشغيل -->
      <!-- <input type="range" id="playbackSpeedRange"
               min="0.5" max="2" step="0.1" value="1"
               onchange="changePlaybackSpeed(event)"> -->

      <select id="playbackSpeedSelect" onchange="changePlaybackSpeed(event)">
        <option value="0.5">0.5x</option>
        <option value="1">1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>

      <input type="checkbox" id="muteCheckbox" onchange="toggleMute()" />
      <label>Mute</label>
      <input type="checkbox" id="loopCheckbox" onchange="toggleLoop()" />
      <label>Loop</label>

      <button id="fullscreenButton">
        <i class="fa-solid fa-expand" onclick="toggleFullScreen()"></i>
      </button>
    </section>
    <script src="./script.js"></script>
  </body>
</html>
