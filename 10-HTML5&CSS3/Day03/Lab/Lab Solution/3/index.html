        <img src="https://picsum.photos/200/200?random=5" draggable="true" />
        <img src="https://picsum.photos/200/200?random=6" draggable="true" />
        <img src="https://picsum.photos/200/200?random=7" draggable="true" />
        <img src="https://picsum.photos/200/200?random=8" draggable="true" />
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
