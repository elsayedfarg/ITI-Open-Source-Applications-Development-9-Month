{% extends 'base.html' %} {% block body %}
<h1 style="display: flex; justify-content: space-between; align-items: center">
  Products
  <a
    href="{% url 'products.create_product' %}"
    class="btn-show"
    style="
      padding: 10px;
      background-color: #4caf50;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    "
  >
    Create Product
  </a>
</h1>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for product in products %}
    <tr>
      <td class="id">{{ product.id }}</td>
      <td>{{ product.name }}</td>
      <td class="price">{{ product.price }} $</td>
      <td>
        <a href="{{ product.show_product }}" class="btn-show">Show</a>

        <form
          action="{{ product.delete_url }}"
          method="POST"
          style="display: inline"
        >
          {% csrf_token %}
          <button
            type="submit"
            style="
              padding: 6px 10px;
              background-color: #e53935;
              color: white;
              border: none;
              border-radius: 4px;
              cursor: pointer;
            "
            onclick="return confirm('Delete {{ product.name }}?')"
          >
            Delete
          </button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
