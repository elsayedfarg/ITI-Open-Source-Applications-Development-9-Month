                      "on-tertiary-container": "#523200",
                      "on-error-container": "#ffdad6",
                      "on-primary": "#003824",
                      "on-primary-fixed": "#002113",
                      "on-surface-variant": "#bbcabf",
                      "inverse-surface": "#dae2fd",

                      "inverse-primary": "#006c49",

                      "on-secondary": "#1000a9",
                      "surface": "#0b1326",
                      "on-tertiary": "#472a00",
                      "on-secondary-container": "#b0b2ff",
                      "error": "#ffb4ab",
                      "primary-fixed": "#6ffbbe",
                      "tertiary-container": "#e29100",
                      "on-tertiary-fixed": "#2a1700",
                      "on-secondary-fixed-variant": "#2f2ebe",
                      "tertiary-fixed-dim": "#ffb95f",
                      "on-background": "#dae2fd",
                      "primary-container": "#10b981",
                      "surface-container": "#171f33",
                      "primary": "#4edea3",
                      "secondary-fixed-dim": "#c0c1ff",
                      "background": "#0b1326",
                      "on-surface": "#dae2fd",
                      "on-secondary-fixed": "#07006c",
                      "outline": "#86948a",
                      "error-container": "#93000a",

              "borderRadius": {
                      "DEFAULT": "0.125rem",

<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1326; 
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3449; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3c4a42; 
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md lg:p-margin-desktop font-body-md">
<div class="w-full max-w-4xl mx-auto">
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary mb-sm">ClinicaPulse</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Patient Registration Portal</p>
</div>
<!-- Main Form Card -->
<div class="bg-surface-container rounded-xl border border-outline-variant/30 overflow-hidden shadow-2xl">
<form action="#" class="p-lg lg:p-xl space-y-xl" method="POST">
<!-- Section 1: Account Information -->
<div class="space-y-lg">
<div class="border-b border-surface-variant pb-sm">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="account_circle" style="font-variation-settings: 'FILL' 1;">account_circle</span>
                            Account Information
                        </h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="username">Username</label>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="username" name="username" placeholder="Choose a username" required="" type="text">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Email Address</label>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="first_name">First Name</label>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="first_name" name="first_name" placeholder="First name" required="" type="text">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="last_name">Last Name</label>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="last_name" name="last_name" placeholder="Last name" required="" type="text">
</div>
<div class="space-y-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg pl-md pr-xl py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
</div>
</div>
<!-- Section 2: Medical Information -->
<div class="space-y-lg">
<div class="border-b border-surface-variant pb-sm">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="medical_information" style="font-variation-settings: 'FILL' 1;">medical_information</span>
                            Medical Information
                        </h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="dob">Date of Birth</label>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none color-scheme-dark" id="dob" name="dob" required="" type="date">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="gender">Gender</label>
<select class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none appearance-none" id="gender" name="gender" required="">
<option disabled="" selected="" value="">Select gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
<option value="prefer_not_to_say">Prefer not to say</option>
</select>
</div>
<div class="space-y-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant block" for="phone">Phone Number</label>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="phone" name="phone" placeholder="+1 (555) 000-0000" required="" type="tel">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="height">Height (cm)</label>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="height" min="0" name="height" placeholder="e.g. 175" type="number">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="weight">Weight (kg)</label>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="weight" min="0" name="weight" placeholder="e.g. 70.5" step="0.1" type="number">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="blood_type">Blood Type</label>
<select class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none appearance-none" id="blood_type" name="blood_type">
<option disabled="" selected="" value="">Select blood type</option>
<option value="A+">A+</option>
<option value="A-">A-</option>
<option value="B+">B+</option>
<option value="B-">B-</option>
<option value="AB+">AB+</option>
<option value="AB-">AB-</option>
<option value="O+">O+</option>
<option value="O-">O-</option>
<option value="unknown">Unknown</option>
</select>
</div>
<div class="space-y-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant block" for="allergies">Known Allergies</label>
<textarea class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none resize-y" id="allergies" name="allergies" placeholder="List any known allergies here..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-md border-t border-surface-variant flex flex-col items-center gap-sm">
<button class="w-full md:w-auto bg-primary-container text-on-primary-container font-body-md font-bold px-xl py-md rounded-lg hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background border border-primary/20 shadow-[0_0_15px_rgba(16,185,129,0.1)] hover:shadow-[0_0_20px_rgba(16,185,129,0.2)]" type="submit">
                        Complete Registration
                    </button>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs mt-sm group" href="#">
<span class="material-symbols-outlined text-sm transition-transform group-hover:-translate-x-1" data-icon="arrow_back">arrow_back</span>
                        Back to Login
                    </a>
</div>
</form>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }

        // Color scheme fix for date picker icon in dark mode
        document.querySelectorAll('input[type="date"]').forEach(input => {
            input.style.colorScheme = 'dark';
        });
    </script>
</body></html>
